project_name: BTH physically interpretable precipitation nowcasting
research_area: Multi-source deep learning for short-term precipitation nowcasting over Beijing-Tianjin-Hebei
research_question: >-
  Can Radar, dynamic PWV, and static DEM be fused through an explicit
  motion/source-sink formulation to improve 0-120 minute precipitation
  nowcasting—especially heavy-rain initiation, intensification, persistence,
  and displacement—without inflating weak-rain area?
current_stage: experiments
