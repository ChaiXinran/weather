last_updated: 2026-08-08
spatial_domain:
  name: Beijing-Tianjin-Hebei
  grid_shape: [66, 70]
  approximate_resolution: 0.1 degree, about 10 km
  time_interval_minutes: 6
sequence_definition:
  input:
    variable: Radar reflectivity
    frames: 10
    duration_minutes: 60
    tensor_shape_per_sample: [10, 1, 66, 70]
  target:
    variable: Future Radar reflectivity
    frames: 20
    duration_minutes: 120
    tensor_shape_per_sample: [20, 1, 66, 70]
  persistence: Repeat the last input frame for all 20 forecast leads
radar:
  source_format: inverse-grayscale PNG
  decoded_dbz: (255 - pixel) * 50 / 255
  training_normalization: (255 - pixel) / 255
  value_range_normalized: [0, 1]
  truth_for_formal_evaluation: Future Radar converted to rain rate by the frozen Z-R relation
pwv:
  source_format: inverse-grayscale PNG
  frames_2025_unique: 29516
  decoded_mm: (255 - pixel) * 80 / 255
  training_normalization: (255 - pixel) / 255
  cache_path_wsl: /mnt/d/_Search/AIforScience/Rewritten/capsule-3935105/data/DATA_2025_S/PWV_CACHE_UINT8
  cache_shape: [29516, 66, 70]
  cache_dtype: uint8
rain:
  source_format: inverse-grayscale PNG
  probable_decode_mm_per_hour: (255 - pixel) * 35 / 255
  frames_2025_unique: 29511
  cache_path_wsl: /mnt/d/_Search/AIforScience/Rewritten/capsule-3935105/data/DATA_2025_S/RAIN_CACHE_UINT8
  cache_shape: [29511, 66, 70]
  cache_dtype: uint8
  limitations:
    - Quantized and capped at 35 mm/h
    - Not independent rain-gauge validation
    - Used for Z-R selection and diagnostic rain-truth evaluation, not the formal Radar-truth score
  frozen_alignment:
    lag_minutes: 42
    row_shift: 0
    col_shift: 1
zr_conversion:
  formula: Z = a * R^b
  operational_a: 200.0
  operational_b: 1.6
  z0_dbz: 0.0
  decision_artifact: .research/zr_protocol_decision.json
